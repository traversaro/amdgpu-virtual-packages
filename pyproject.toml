[project]
name = "amdgpu-virtual-packages"
version = "0.1.0"
description = "Conda virtual packages for AMDGPU hardware."
requires-python = ">=3.10"
dependencies = []

[project.entry-points.conda]
amdgpu = "amdgpu_virtual_packages.plugin"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
conda = "*"

[tool.pixi.pypi-dependencies]
amdgpu-virtual-packages = { path = ".", editable = true }

[tool.pixi.tasks]
print-amdgpu-virtual-packages = "python -m amdgpu_virtual_packages"
